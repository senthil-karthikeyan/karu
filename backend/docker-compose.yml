services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/karu}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-to-a-secure-access-secret-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-to-a-secure-refresh-secret-in-production}
      GOTH_SESSION_SECRET: ${GOTH_SESSION_SECRET:-change-this-to-a-secure-goth-cookie-secret-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - karu_network

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: karu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - karu_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U postgres -d karu'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - karu_network

volumes:
  karu_postgres_data:

networks:
  karu_network:
